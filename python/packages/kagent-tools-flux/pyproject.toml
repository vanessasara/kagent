[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagent-tools-flux"
version = "0.1.0"
description = "FluxCD MCP tool server for kagent - GitOps continuous delivery tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kubernetes>=31.0.0",
  "pydantic>=2.5.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "pytest-mock>=3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kagent_tools_flux"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
