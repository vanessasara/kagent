[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagent-tools-cert-manager"
version = "0.1.0"
description = "cert-manager MCP tools for kagent - monitor and manage TLS certificates in Kubernetes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kubernetes>=31.0.0",
  "mcp>=1.25.0",
  "pydantic>=2.5.0",
  "python-dateutil>=2.8.0",
]

[tool.uv.sources]

[project.optional-dependencies]
test = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "pytest-mock>=3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kagent"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
